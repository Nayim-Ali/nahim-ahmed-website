[build]
  command   = "npm run build"
  publish   = "dist"

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Tighter CSP on the admin panel
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.netlify.com https://*.netlify.com; frame-src 'self' https://www.youtube.com; font-src 'self' data:"

# ── Netlify Identity ─────────────────────────────────────────────────────────
[build.environment]
  NODE_VERSION = "20"
